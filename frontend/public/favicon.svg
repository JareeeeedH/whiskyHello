<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="WhiskyHello">
  <!-- Dark tile -->
  <rect width="32" height="32" rx="8" fill="#1c1917"/>

  <!-- Rocks / whisky glass (front 3/4 view, geometric) -->
  <!-- Glass body -->
  <path
    fill="#292524"
    stroke="#f59e0b"
    stroke-width="1.25"
    stroke-linejoin="round"
    d="M9.5 8.5h13l-1.4 16.2c-.12 1.35-1.25 2.4-2.6 2.4h-5c-1.35 0-2.48-1.05-2.6-2.4L9.5 8.5z"
  />
  <!-- Inner liquid fill -->
  <path
    fill="#b45309"
    opacity="0.92"
    d="M11.2 14.5h9.6l-.85 9.7c-.08.85-.8 1.5-1.65 1.5h-4.6c-.85 0-1.57-.65-1.65-1.5l-.85-9.7z"
  />
  <!-- Liquid surface highlight -->
  <rect x="11.4" y="14.5" width="9.2" height="1.4" rx="0.4" fill="#fbbf24" opacity="0.75"/>
  <!-- Rim -->
  <rect
    x="9.25"
    y="7.75"
    width="13.5"
    height="1.75"
    rx="0.6"
    fill="none"
    stroke="#f59e0b"
    stroke-width="1.2"
  />
  <!-- Small ice cube cue -->
  <rect
    x="13.2"
    y="16.8"
    width="3.2"
    height="2.6"
    rx="0.35"
    fill="#fde68a"
    opacity="0.35"
  />

  <!-- WH mark over the glass -->
  <text
    x="16"
    y="22.2"
    text-anchor="middle"
    dominant-baseline="middle"
    fill="#fafaf9"
    font-family="Georgia, 'Times New Roman', 'Noto Serif', serif"
    font-size="7.5"
    font-weight="700"
    letter-spacing="0.4"
  >WH</text>
</svg>
