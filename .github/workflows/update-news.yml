name: Update Homepage News

# Every Monday 01:00 UTC (09:00 Taiwan). Can also be run by hand from the Actions tab.
on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Fetch news
        working-directory: backend
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: npm run news:fetch

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- frontend/src/data/news.ts; then
            echo "No new news this week."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The PR keeps the report for later review.
      - name: Open pull request
        id: pr
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="news/$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add frontend/src/data/news.ts
          git commit -m "首頁新聞自動更新 $(date -u +%Y-%m-%d)"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "首頁新聞自動更新 $(date -u +%Y-%m-%d)" \
            --body-file backend/scripts/news/output/report.md
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      # Safety checks before merging (spec section 7). If one fails, the job stops and the PR stays open for a person to check.
      - name: Check news count and pictures
        if: steps.changes.outputs.changed == 'true'
        run: |
          FILE=frontend/src/data/news.ts
          ITEMS=$(grep -c "^    id:" "$FILE")
          IMAGES=$(grep -c "^    imageUrl:" "$FILE")
          echo "items=$ITEMS images=$IMAGES"
          if [ "$ITEMS" -ne 10 ] || [ "$IMAGES" -ne "$ITEMS" ]; then
            echo "Expected 10 items, all with pictures."
            exit 1
          fi

      - name: Check frontend build
        if: steps.changes.outputs.changed == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Merge pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ steps.pr.outputs.branch }}" --squash --delete-branch
